<style>
:root{
  --navy:#0F2A3F;
  --navy-2:#153B57;
  --teal:#0F6E56;
  --teal-light:#E1F5EE;
  --coral:#D85A30;
  --coral-light:#FAECE7;
  --paper:#F7F5F0;
  --card:#FFFFFF;
  --ink:#16241F;
  --ink-soft:#5B6B66;
  --line:#DDE3DD;
  --danger:#A32D2D;
  --danger-light:#FCEBEB;
  --gold:#BA7517;
  --gold-light:#FAEEDA;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;}
.screen{display:none;flex:1;flex-direction:column;animation:fadeIn .18s ease;}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.2px;}
.topbar .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--navy-2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
.topbar .back{background:none;border:none;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer;line-height:1;}
.topbar .spacer{flex:1;}
.topbar .icon-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;}

/* ---------- Home screen ---------- */
.home-hero{padding:28px 20px 18px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,#1c4c66 100%);color:#fff;position:relative;}
.streak-corner{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.14);border-radius:20px;padding:6px 12px 6px 10px;display:flex;align-items:center;gap:5px;}
.streak-flame{font-size:15px;line-height:1;}
.streak-num{font-size:14px;font-weight:800;}
.home-hero h1{font-size:22px;margin:0 0 4px;font-weight:700;}
.home-hero p{margin:0;font-size:13.5px;color:#cfe0e6;}
.stat-strip{display:flex;gap:10px;margin-top:16px;}
.stat-pill{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;flex:1;}
.stat-pill .n{font-size:19px;font-weight:700;}
.stat-pill .l{font-size:11px;color:#cfe0e6;margin-top:2px;}

.section{padding:18px 16px 6px;}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;margin:0 0 10px;}

.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 6px;}
.subject-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;text-align:left;cursor:pointer;transition:transform .1s;}
.subject-card:active{transform:scale(.97);}
.subject-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;}
.subject-card.med .ic{background:var(--teal-light);color:var(--teal);}
.subject-card.peds .ic{background:var(--coral-light);color:var(--coral);}
.subject-card.clin .ic{background:var(--gold-light);color:var(--gold);}
.subject-card.misc .ic{background:#EEEDFE;color:#534AB7;}
.subject-card.board .ic{background:#E3F0FC;color:#1C6FB0;}
.subject-card.surg .ic{background:#FDEAEA;color:#B0231C;}
.subject-card h3{font-size:15px;margin:0 0 3px;}
.subject-card p{font-size:12px;color:var(--ink-soft);margin:0;}

.list-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin:0 16px 8px;cursor:pointer;}
.list-row:active{background:#f0efe9;}
.list-row .lr-main{display:flex;flex-direction:column;gap:2px;}
.list-row .lr-title{font-size:14.5px;font-weight:600;}
.list-row .lr-sub{font-size:12px;color:var(--ink-soft);}
.list-row .lr-badge{font-size:11px;background:var(--teal-light);color:var(--teal);padding:3px 9px;border-radius:20px;font-weight:700;}

/* ---------- Setup screen ---------- */
.setup-header{padding:18px 16px 8px;}
.setup-header h2{margin:0 0 4px;font-size:19px;}
.setup-header p{margin:0;font-size:13px;color:var(--ink-soft);}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.chip .cnt{color:var(--ink-soft);font-size:11.5px;}
.chip.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip.selected .cnt{color:#cfe0e6;}
.chip-actions{display:flex;gap:10px;padding:2px 16px 4px;}
.link-btn{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;padding:4px 0;cursor:pointer;}

.option-row{display:flex;gap:10px;padding:10px 16px;}
.opt-btn{flex:1;padding:12px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;text-align:center;cursor:pointer;color:var(--ink);}
.opt-btn.selected{border-color:var(--navy);background:var(--navy);color:#fff;}

.numstep{display:flex;align-items:center;gap:14px;padding:8px 16px;}
.numstep button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;}
.numstep .val{font-size:17px;font-weight:700;min-width:60px;text-align:center;}

.cta-bar{padding:16px;margin-top:auto;}
.btn-primary{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;}
.btn-primary:disabled{opacity:.4;}
.btn-secondary{width:100%;background:var(--card);color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--radius-sm);padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:10px;}
.btn-ghost{width:100%;background:none;color:var(--ink-soft);border:none;padding:10px;font-size:13px;cursor:pointer;}

/* ---------- Quiz screen ---------- */
.quiz-topbar{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.quiz-topbar .qexit{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 6px;}
.progress-wrap{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .2s;}
.quiz-topbar .timer{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:8px;}
.quiz-topbar .qcount{font-size:12.5px;color:#cfe0e6;white-space:nowrap;}

.qbody{padding:18px 18px 10px;flex:1;overflow-y:auto;}
.qmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:20px;}
.tag.subj{background:var(--teal-light);color:var(--teal);}
.tag.sys{background:#EEEDFE;color:#534AB7;}
.tag.new{background:var(--coral-light);color:var(--coral);}
.qstem{font-size:16.5px;line-height:1.55;margin:0 0 18px;}
.qoptions{display:flex;flex-direction:column;gap:10px;}
.qopt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;cursor:pointer;background:var(--card);transition:border-color .1s;}
.qopt:active{background:#f4f3ee;}
.qopt .letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;margin-top:1px;}
.qopt .otext{font-size:14.5px;line-height:1.45;padding-top:1px;}
.qopt.picked{border-color:var(--navy);}
.qopt.picked .letter{background:var(--navy);border-color:var(--navy);color:#fff;}
.qopt.correct{border-color:var(--teal);background:var(--teal-light);}
.qopt.correct .letter{background:var(--teal);border-color:var(--teal);color:#fff;}
.qopt.incorrect{border-color:var(--danger);background:var(--danger-light);}
.qopt.incorrect .letter{background:var(--danger);border-color:var(--danger);color:#fff;}
.qopt.disabled{cursor:default;}

.flag-row{display:flex;justify-content:flex-end;margin:2px 0 14px;}
.flag-btn{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:5px;}
.flag-btn.flagged{background:var(--gold-light);border-color:var(--gold);color:var(--gold);font-weight:700;}
.mastery-banner{background:var(--teal-light);color:var(--teal);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:14px;font-weight:600;}

.explain-box{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.explain-verdict{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;margin-bottom:12px;}
.explain-verdict.ok{color:var(--teal);}
.explain-verdict.no{color:var(--danger);}
.explain-sec{margin-bottom:14px;}
.explain-sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:0 0 6px;font-weight:700;}
.explain-sec p{font-size:14px;line-height:1.6;margin:0;color:var(--ink);}
.wrong-item{font-size:13.5px;line-height:1.55;margin:0 0 8px;padding-left:14px;border-left:2px solid var(--line);}
.wrong-item b{color:var(--ink);}
.pearl-box{background:var(--gold-light);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;line-height:1.55;color:#5c3d0c;}
.source-line{font-size:11.5px;color:var(--ink-soft);margin-top:12px;font-style:italic;}

.quiz-footer{padding:12px 16px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:10px;}
.quiz-footer button{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:700;cursor:pointer;border:none;}
.nav-prev{background:var(--card);border:1.5px solid var(--line) !important;color:var(--ink);}
.nav-skip{background:var(--card);border:1.5px solid var(--line) !important;color:var(--ink-soft);flex:0 0 auto;padding-left:18px;padding-right:18px;}
.nav-submit{background:var(--navy);color:#fff;}
.nav-submit:disabled{opacity:.35;}
.nav-next{background:var(--navy);color:#fff;}

/* ---------- Results screen ---------- */
.results-hero{padding:30px 20px;text-align:center;background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;}
.score-ring{width:120px;height:120px;margin:0 auto 14px;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;}
.results-hero h2{margin:6px 0 2px;font-size:17px;}
.results-hero p{margin:0;font-size:13px;color:#cfe0e6;}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px;}
.result-stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
.result-stat .n{font-size:18px;font-weight:800;}
.result-stat.correct .n{color:var(--teal);}
.result-stat.incorrect .n{color:var(--danger);}
.result-stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}

.review-list{padding:0 16px;}
.review-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--card);cursor:pointer;}
.review-row .ri{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;}
.review-row .ri.c{background:var(--teal);}
.review-row .ri.x{background:var(--danger);}
.review-row .rtext{font-size:13px;flex:1;line-height:1.4;color:var(--ink-soft);}
.review-row .rflag{color:var(--gold);font-size:14px;}

/* ---------- Stats screen ---------- */
.stat-card-lg{margin:0 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.stat-card-lg h4{margin:0 0 10px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-row .bname{font-size:12.5px;width:110px;flex-shrink:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:8px;background:#EDEBE3;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.bar-pct{font-size:12px;font-weight:700;width:34px;text-align:right;flex-shrink:0;}

.empty-state{padding:40px 24px;text-align:center;color:var(--ink-soft);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}
.empty-state p{font-size:13.5px;line-height:1.6;margin:0;}

.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px);}
.tabbar-sp{height:calc(64px + env(safe-area-inset-bottom,0px));flex:none}
.ct-box{text-align:center;padding:14px 8px}.ct-t{font-weight:800;font-size:16px;color:var(--ink)}.ct-s{font-size:12.5px;color:var(--ink-soft);margin:3px 0 12px}.ct-row{display:flex;gap:12px;justify-content:center}.ct-b{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px}.ct-b.ig{background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888)}
.tab-btn{flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink-soft);font-size:10.5px;}
.tab-btn.active{color:var(--navy);font-weight:700;}
.tab-btn .tic{font-size:19px;}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--ink-soft);}

/* ---------- Flashcards ---------- */
.flashcard{margin-top:14px;min-height:220px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--card);position:relative;display:flex;align-items:center;justify-content:center;padding:26px 22px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.fc-face{display:none;text-align:center;}
.fc-face p{font-size:17px;line-height:1.6;margin:0;color:var(--ink);}
.flashcard .fc-front{display:block;}
.flashcard.flipped .fc-front{display:none;}
.flashcard.flipped .fc-back{display:block;}
.fc-back .fc-extra{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-soft);line-height:1.55;text-align:left;}
.cloze-blank{display:inline-block;min-width:44px;border-bottom:2px solid var(--gold);color:var(--gold);font-weight:700;}
.cloze-answer{display:inline-block;color:var(--teal);font-weight:700;background:var(--teal-light);padding:1px 8px;border-radius:6px;}
.fc-rating-row{display:flex;gap:10px;margin-top:18px;}
.fc-rating-row button{flex:1;padding:14px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:700;cursor:pointer;border:none;}
.fc-again{background:var(--danger-light);color:var(--danger);}
.fc-good{background:var(--teal-light);color:var(--teal);}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}

.name-modal{position:fixed;inset:0;background:rgba(15,42,63,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.name-modal.hidden{display:none;}
.name-sheet{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
.name-sheet h3{margin:0 0 6px;font-size:17px;}
.name-sheet p{margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.name-sheet input{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);font-size:15px;margin-bottom:12px;}

::-webkit-scrollbar{display:none;}

/* ---------- Brand hero + topics + search ---------- */
.home-hero{padding:22px 20px 20px;background:radial-gradient(120% 90% at 0% 0%,#1d5a73 0%,transparent 55%),linear-gradient(160deg,#0a2133 0%,var(--navy) 45%,var(--navy-2) 100%);overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(15,42,63,.25);}
.home-hero>*:not(.streak-corner){position:relative;z-index:1}
.hero-glow{position:absolute!important;border-radius:50%;filter:blur(40px);z-index:0!important;pointer-events:none}
.hero-glow.g1{width:200px;height:200px;background:#2dd4bf;opacity:.28;right:-60px;top:-60px}
.hero-glow.g2{width:160px;height:160px;background:#38bdf8;opacity:.18;left:-50px;bottom:-40px}
.hero-dots{position:absolute!important;inset:0;z-index:0!important;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:18px 18px;-webkit-mask-image:linear-gradient(160deg,#000,transparent 70%);mask-image:linear-gradient(160deg,#000,transparent 70%);pointer-events:none}
.streak-corner{position:absolute!important;z-index:2!important;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)}
.logo-card{display:inline-block;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 3px rgba(45,212,191,.25);max-width:62%}
.logo-card img{display:block;height:34px;width:auto;max-width:100%}
.hero-tag{margin-top:16px;font-size:11px;letter-spacing:2.4px;font-weight:700;color:#5eead4}
.home-hero h1{font-size:27px;margin:4px 0 6px;font-weight:800;letter-spacing:-.4px}
.made-by{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 13px;border-radius:999px;background:linear-gradient(90deg,rgba(45,212,191,.22),rgba(56,189,248,.16));border:1px solid rgba(94,234,212,.4);font-size:12.5px;color:#e6fffa}
.made-by b{color:#fff;letter-spacing:.3px}.mb-star{color:#5eead4}
.stat-pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px)}
.credit-foot{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 16px 18px;color:var(--ink-soft);font-size:12.5px;text-align:left;line-height:1.35}
.credit-foot img{width:30px;height:30px;border-radius:8px}.credit-foot span{color:var(--teal);font-weight:700}
.searchbar{position:sticky;top:54px;z-index:19;display:flex;align-items:center;gap:8px;background:var(--navy);padding:0 16px 12px}
.searchbar .sicon{position:absolute;left:28px;top:9px;font-size:14px;opacity:.6;pointer-events:none}
.searchbar input{flex:1;width:100%;border:none;border-radius:12px;padding:11px 36px 11px 38px;font-size:14.5px;background:#fff;color:var(--ink);outline:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.searchbar input:focus{box-shadow:0 0 0 2px #5eead4}
.searchbar #qClear{position:absolute;right:26px;top:4px;border:none;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:2px 6px}
.acc{margin:0 16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.acc-head{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;background:none;border:none;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.acc-t{flex:1}.acc-n{font-size:12px;color:var(--ink-soft);font-weight:500}
.acc-sel{font-size:11px;background:var(--teal-light);color:var(--teal);border-radius:10px;padding:2px 8px;font-weight:700}
.acc-c{transition:transform .2s;color:var(--ink-soft)}.acc.open .acc-c{transform:rotate(180deg)}
.acc-body{padding:2px 12px 12px!important;margin:0!important}
.uni-badge{margin:8px 0 2px;font-size:13px;color:#cfe9f0;line-height:1.4}.uni-badge b{color:#5eead4;letter-spacing:.5px}
.logo-wrap{display:flex;justify-content:center;margin-top:30px}
.logo-card{padding:16px 26px;border-radius:22px;max-width:92%}
.logo-card img{height:62px}
.hero-tag,.home-hero h1,.home-hero p,.uni-badge{text-align:center}
.made-by{display:flex;width:fit-content;margin-left:auto;margin-right:auto}
.deck-list{display:flex;flex-direction:column;gap:14px;padding:0 16px}
.deck-card{display:flex;align-items:center;gap:14px;text-align:left;border:none;border-radius:20px;padding:20px 18px;cursor:pointer;color:#fff;box-shadow:0 8px 20px rgba(15,42,63,.18)}
.deck-card.lumhs{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#0F6E56 130%)}
.deck-card.extra{background:linear-gradient(135deg,#0F6E56 0%,#1b8f78 100%)}
.deck-ic{font-size:30px;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.deck-tx{flex:1;min-width:0}.deck-tx h3{margin:0 0 3px;font-size:20px;font-weight:800;color:#fff}
.deck-tx p{margin:0 0 6px;font-size:12.5px;color:#d7eaf0;line-height:1.35}
.deck-tx span{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 9px}
.deck-go{font-size:30px;opacity:.8}
.deck-ic.lg{background:#fff;padding:4px;width:64px;height:64px;border-radius:50%}.deck-ic.lg img{width:100%;height:100%;object-fit:contain}
.lock-screen{min-height:100vh;box-sizing:border-box;padding:28px 20px 24px;background:radial-gradient(120% 80% at 0% 0%,#1d5a73 0%,transparent 55%),linear-gradient(160deg,#0a2133,var(--navy) 50%,var(--navy-2));color:#fff;text-align:center}
.lock-screen .logo-card{padding:12px 20px}.lock-screen .logo-card img{height:48px}
.lock-screen h2{font-size:24px;margin:22px 0 6px;font-weight:800}.lock-sub{font-size:13.5px;color:#cfe0e6;line-height:1.5;margin:0 auto 6px;max-width:340px}

/* ===== Medixella premium theme (v3) ===== */
:root{--gold:#C9A24B;--gold-2:#E8CB86;--gold-light:#FAF1DB;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--shadow-lg:0 14px 34px -14px rgba(15,42,63,.35);--shadow-sm:0 4px 14px -8px rgba(15,42,63,.28);}
body{background:linear-gradient(180deg,#F4F1EA 0%,#F9F7F2 40%);}
.home-hero{padding:0 20px 20px;background:#0b1d33;overflow:hidden;border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg);}
.home-hero .campus{position:absolute;left:0;right:0;top:0;height:285px;background-size:cover;background-position:center bottom;}
.home-hero .campus::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,29,51,.15) 0%,rgba(11,29,51,0) 40%,rgba(11,29,51,.85) 88%,#0b1d33 100%);}
.home-hero>*:not(.campus):not(.hero-glow):not(.hero-dots){position:relative;z-index:2;}
.home-hero .hero-glow,.home-hero .hero-dots{display:none;}
.hero-spacer{height:195px;}
.home-hero .logo-wrap{margin-top:0;}
.home-hero .logo-card{transform:scale(.72);transform-origin:center center;margin:-14px 0 -14px;}
.home-hero .streak-corner{position:absolute;top:14px;right:14px;z-index:3;background:rgba(11,29,51,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(232,203,134,.45);}
.home-hero h1{font-family:var(--serif);font-size:27px;letter-spacing:.2px;font-weight:600;}
.home-hero h1 em{font-style:normal;color:var(--gold-2);}
.rank-chip{display:flex;width:max-content;margin:10px auto 8px;align-items:center;gap:6px;border:1px solid rgba(232,203,134,.55);color:var(--gold-2);background:rgba(11,29,51,.5);backdrop-filter:blur(6px);border-radius:20px;padding:4px 11px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}

.section-title{font-family:var(--serif);color:var(--navy);letter-spacing:.9px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);}
.subject-card,.deck-card,.list-row,.ip-card{border:1px solid #E7E1D2;box-shadow:var(--shadow-sm);}
.subject-card{position:relative;overflow:hidden;border-radius:16px;}

.deck-card{border-radius:18px;}

.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 8px 18px -10px rgba(15,42,63,.7);}
.credit-foot{font-family:var(--serif);}
.tabbar{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}

/* ---- Today panel ---- */
.today{margin:14px 16px 0;background:linear-gradient(145deg,#fff,#FBF7EC);border:1px solid #E7DBB8;border-radius:20px;padding:16px;box-shadow:var(--shadow-lg);}

    else if (b.t === 'p' || b.t === 'note') t += b.x + '\n';
    else if (b.t === 'pearl') t += 'PEARL: ' + b.x + '\n';
    else if (b.t === 'trap') t += 'TRAP: ' + b.x + '\n';

// window.storage is only available when this file runs inside a Claude
// artifact frame. If it's missing (opened as a plain HTML file, or an
// environment that hasn't injected it), fall back to an in-memory store so
// the app still works for the current session instead of crashing outright.

async function storageGet(key, shared) {
  const fullKey = (shared ? 'shared:' : 'priv:') + key;

// ===================== STREAK =====================
function dateKey(d) {
  // Local-date key (YYYY-MM-DD) so the streak follows the user's own day,
  // not UTC — a study session at 11pm shouldn't get miscounted.
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

async function touchStreak() {
  const stats = await getLocalStats();
  const today = dateKey(new Date());
  if (stats.streak.lastActiveDate === today) return; // already counted today

  if (stats.streak.lastActiveDate) {
    const prev = new Date(stats.streak.lastActiveDate + 'T00:00:00');
    const diffDays = Math.round((new Date(today + 'T00:00:00') - prev) / 86400000);
    if (diffDays === 1) {
      stats.streak.current += 1;
    } else if (diffDays > 1) {
      stats.streak.current = 1; // streak broken, restart today
    }
    // diffDays === 0 handled by the early return above
  } else {
    stats.streak.current = 1; // very first day ever
  }
  stats.streak.longest = Math.max(stats.streak.longest || 0, stats.streak.current);
  stats.streak.lastActiveDate = today;
  await saveLocalStats();
}

function mxqCheck() {

// Online check: the app reads Medixella's signed status.json (next to the app, or the link
// inside the code) and learns whether this device was unsubscribed or its access extended.
// Returns { rev, ext } or null when offline / file missing / signature wrong.
async function mxqStatusCheck(L, did) {
  if (!L || L.acct || !navigator.onLine) return null;
  try {
    const base = L.url || new URL('../status.json', location.href).href;
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(base + (base.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return null;
    const st = MXL.readStatus(MXQ_PUB, await r.text());
    if (!st) return null;
    const id = MXL.norm(did);
    const rev = st.revoked.includes(id);
    lsSet('revoked', rev ? '1' : '');

async function init() {
  if (TRIAL && !(await trGate())) return;
  if (!TRIAL && !MXQ_ACCT && (lsGet('alease') || mxqCheck().state !== 'ok' || /oobCode=/.test(location.href))) {
    // account path (log in), unless this device still runs on an old activation code
    await accHandleEmailLink();
    currentScreen = 'loading'; render();
    const g = await accGate();
    if (g.state !== 'ok') { showAccount(g); return; }
    ACC_REVOKED = false; MXQ_ACCT = g;
    MXQ_ACCT_L = { acct: true, exp: g.lease && g.lease.x ? 1 : 0, expStr: (g.lease && g.lease.x) || '', ids: [], wraps: [] };
    await Promise.race([accSyncPull(), new Promise(r => setTimeout(r, 6000))]); accSyncStart();
    accWatermark();
  }
  if (ACC_REVOKED) return;
  const lic = TRIAL ? { state: 'ok', did: '', L: null } : mxqCheck();
  if (lic.state !== 'ok') { showLock(lic); return; }
  MXQ_LIC = lic.L;
  if (!TRIAL) {
    if (!lsGet('lb:on')) lsSet('lb:on', '1');
    if (mxqName() && lsGet('lb:name') !== mxqName().slice(0, 24)) lsSet('lb:name', mxqName().slice(0, 24));
    mxqStatusCheck(lic.L, lic.did).then(r => { if (r && r.rev && currentScreen !== 'quiz') init(); });
  }
  if (!MXQ_DATA_READY) {
    currentScreen = 'loading'; render();
    try {
      const u = TRIAL ? await trUnlock() : await mxqUnlockData(lic.L, lic.did);
      if (u === 'nokey' || u === 'badkey') { showLock({ state: 'nokey', did: lic.did, L: lic.L }); return; }
    } catch (e) {
      if (e.code === 'nocrypto') mxqDataError('Please open the app from its link in Chrome or Safari (the link starts with https://).', false);
      else mxqDataError('The questions could not be loaded. Connect to the internet once, then tap Try again. After that the app works offline.', true);
      return;
    }
  }
  if (ACC_REVOKED) return;
  render();

  const rawName = await storageGet('myname', false);
  if (rawName) {
    try { userName = JSON.parse(rawName); } catch (e) { userName = ''; }
  }

  // No name prompt any more: progress is stored under a fixed profile
  // (or the old name if one was saved earlier, so existing progress is kept).
  if (!userName) userName = 'student';

  MANIFEST = loadManifest();
  await ensureLoaded();
  await getLocalStats();
  if (userName) await touchStreak();
  if (ACC_REVOKED) return;
  currentScreen = 'home';
  render();

  if (!STORAGE_AVAILABLE) {
    console.warn('Medixella Qbank: persistent storage is not available in this environment — your name and progress will only be kept for this session.');
  }
}

// ===================== QUIZ SESSION =====================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}


function qText(q) {
  if (!q._t) q._t = (q.system+' '+(q.topic||'')+' '+q.stem+' '+Object.values(q.options).join(' ')+' '+q.why_correct+' '+(q.take_home||'')).toLowerCase();
  return q._t;
}
function queryWords() { return (setup.query||'').toLowerCase().split(/\s+/).filter(Boolean); }
function matchesQuery(q, words) { if (!words.length) return true; const t = qText(q); return words.every(w => t.includes(w)); }
function inSelection(q) {
  if (q.subject !== setup.subject) return false;
  if (setup.only && !setup.only.includes(q.system)) return false;
  if (!setup.systems.length && !(setup.topics||[]).length) return true;
  return setup.systems.includes(q.system) || (setup.topics||[]).includes(q.system+'||'+q.topic);
}
function poolForSetup() {
  const w = queryWords();
  return QBANK.filter(q => inSelection(q) && matchesQuery(q, w));
}

function isMastered(stats, qid) {
  const a = stats.attempts[qid];
  return !!(a && a.lastCorrect === true);
}

async function startQuiz() {
  await ensureLoaded();
  let pool = poolForSetup();

  const stats = await getLocalStats();
  if (setup.flaggedOnly) {
    pool = pool.filter(q => stats.flagged[q.id]);
  }
  if (setup.incorrectOnly) {
    pool = pool.filter(q => {
      const a = stats.attempts[q.id];
      return a && a.lastCorrect === false;
    });
  } else if (!setup.flaggedOnly && setup.includeAll === false) {
    // Default behaviour: don't repeat a question once it's been answered
    // correctly, until every question in the current pool has been
    // mastered — at which point the pool resets so studying can continue.
    const unmastered = pool.filter(q => !isMastered(stats, q.id));
    if (unmastered.length === 0 && pool.length > 0) {
      alert('You have already answered every question in this selection correctly. Questions you get wrong will come back here. Pick other systems to keep going.');
      return;
    }
    pool = unmastered;
  }

  pool = shuffle(pool);
  if (setup.count > 0) pool = pool.slice(0, setup.count);
  if (pool.length === 0) {
    alert('No questions match these filters yet. Try different settings.');
    return;
  }

  let names = setup.topics.length ? setup.topics.map(k => k.split('||')[1]) : setup.systems;
  if (isModMode()) names = setup.systems.length ? [] : [...new Set(names.map(subjOf))];
  const title = (isModMode() ? setup.only[0] : setup.subject) + (names.length ? ' · ' + (names.length > 2 ? names.slice(0, 2).join(', ') + ' +' + (names.length - 2) : names.join(', ')) : (isModMode() ? ' · All subjects' : ' · All systems'));
  session_justReset = false;
  await touchStreak();
  beginSession(pool, { kind: 'block', title, subject: setup.subject, systems: setup.systems.slice(), mode: setup.mode, reviewMode: setup.reviewMode || 'immediate' }, stats);
}

// ===================== SESSIONS: save & resume =====================
function loadBlocks() { try { return JSON.parse(lsGet('blocks') || '[]'); } catch (e) { return []; } }

}
function removeBlock(id) { storeBlocks(loadBlocks().filter(x => x.id !== id)); }
function stopTimer() { if (session && session.timerId) { clearInterval(session.timerId); session.timerId = null; } }
function startTimer() {
  stopTimer();

    session.timerId = setInterval(() => {

      updateTimerDisplay();
      if (session.kind === 'mock' && session.limit && session.secondsElapsed >= session.limit) {

}

    kind: meta.kind || 'block', title: meta.title || 'Block', subject: meta.subject || null, systems: meta.systems || [],
    questions: pool, idx: 0, answers: {}, submitted: {}, skipped: {}, flags: {},

async function resumeBlock(id) {

  if (!rec) return;
  const byId = {}; for (const q of QBANK) byId[q.id] = q;
  const qs = rec.qids.map(i => byId[i]).filter(Boolean);
  if (!qs.length) { removeBlock(id); render(); return; }
  const stats = await getLocalStats();
  session = {
    id: rec.id, kind: rec.kind, title: rec.title, subject: rec.subject, systems: rec.systems || [],
    questions: qs, idx: Math.min(rec.idx || 0, qs.length - 1), answers: rec.answers || {}, submitted: rec.submitted || {}, skipped: rec.skipped || {}, undo: rec.undo || {}, dayInfo: rec.dayInfo || {}, flags: {},
    startedAt: Date.now(), created: rec.created, secondsElapsed: rec.secondsElapsed || 0, timerId: null,
    mode: rec.mode, reviewMode: rec.reviewMode || 'immediate', limit: rec.limit || 0, finished: false, justResetPool: false,

window.addEventListener('pagehide', () => { try { saveSession(); } catch (e) {} });

function fmtClock(total) {
  total = Math.max(0, total);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = total % 60;
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') : m + ':' + String(sec).padStart(2, '0');
}
function updateTimerDisplay() {
  const el = document.getElementById('quizTimer');
  if (!el || !session) return;
  if (session.kind === 'mock') {
    const left = Math.max(0, (session.limit || 0) - session.secondsElapsed);
    el.textContent = fmtClock(left);
    el.classList.toggle('low', left <= 300);
    return;
  }
  const total = session.mode === 'timed' ? Math.max(0, session.questions.length * 90 - session.secondsElapsed) : session.secondsElapsed;
  const m = Math.floor(total / 60), s = total % 60;
  el.textContent = (session.mode === 'timed' && total === 0 ? "0:00" : m + ':' + String(s).padStart(2, '0'));
}

function currentQuestion() { return session.questions[session.idx]; }

function pickOption(letter) {
  const q = currentQuestion();
  if (session.submitted[q.id] || session.finished) return;
  session.answers[q.id] = letter;
  saveSession();
  render();
}

async function submitAnswer() {
  const q = currentQuestion();
  if (!session.answers[q.id]) return;
  session.submitted[q.id] = true;

  const stats = await getLocalStats();
  mxDaily(stats);
  const correct = session.answers[q.id] === q.correct_letter;
  session.undo = session.undo || {};
  session.undo[q.id] = stats.attempts[q.id] ? Object.assign({}, stats.attempts[q.id]) : null;
  stats.attempts[q.id] = stats.attempts[q.id] || { seen: 0, correctCount: 0 };
  stats.attempts[q.id].seen++;
  if (correct) stats.attempts[q.id].correctCount++;
  stats.attempts[q.id].lastCorrect = correct;
  stats.attempts[q.id].subject = q.subject;
  stats.attempts[q.id].system = q.system;
  stats.attempts[q.id].lastSeen = Date.now();
  mxDayAdd(stats, mxDayKey(), 1, correct ? 1 : 0); session.dayInfo = session.dayInfo || {}; session.dayInfo[q.id] = { k: mxDayKey(), c: correct ? 1 : 0 };
  await saveLocalStats();
  lbSyncSoon();
  saveSession();
  render();
}

// Let the student take back a submitted answer (before the block is finished) and answer again.
async function changeAnswer() {
  if (!session || session.finished || session.kind === 'mock') return;
  const q = currentQuestion();
  if (!session.submitted[q.id]) return;
  const stats = await getLocalStats();
  if (session.dayInfo && session.dayInfo[q.id]) { const di = session.dayInfo[q.id]; mxDayAdd(stats, di.k, -1, -di.c); delete session.dayInfo[q.id]; }
  if (session.undo && q.id in session.undo) {
    const prev = session.undo[q.id];
    if (prev === null) delete stats.attempts[q.id]; else stats.attempts[q.id] = Object.assign({}, prev);
    delete session.undo[q.id];
    await saveLocalStats();
  }
  delete session.submitted[q.id];
  delete session.answers[q.id];
  if (session.skipped) delete session.skipped[q.id];
  saveSession();
  render();
}

function toggleFlag() {
  const q = currentQuestion();
  session.flags[q.id] = !session.flags[q.id];
  getLocalStats().then(stats => {
    if (session.flags[q.id]) stats.flagged[q.id] = true;
    else delete stats.flagged[q.id];
    saveLocalStats();
  });
  saveSession();
  render();
}

function nextQuestion() {
  if (session.idx < session.questions.length - 1) {
    session.idx++;
    saveSession();
    render();
  } else {
    const left = session.questions.filter(q => !session.submitted[q.id]).length;
    if (left && !confirm(`${left} question${left === 1 ? ' is' : 's are'} not answered yet. You can go back with the Back button. Finish the block anyway?`)) return;
    finishQuiz();
  }
}
function prevQuestion() {
  if (session.idx > 0) { session.idx--; saveSession(); render(); }
}

async function finishQuiz() {
  stopTimer();
  const stats = await getLocalStats();
  if (session.kind === 'mock') {
    // Mock tests give no feedback while running: grade everything now.
    mxDaily(stats);
    for (const q of session.questions) {
      const pick = session.answers[q.id];
      if (!pick || session.submitted[q.id]) continue;
      session.submitted[q.id] = true;
      const correct = pick === q.correct_letter;
      const at = stats.attempts[q.id] = stats.attempts[q.id] || { seen: 0, correctCount: 0 };
      at.seen++; if (correct) at.correctCount++;
      at.lastCorrect = correct; at.subject = q.subject; at.system = q.system; at.lastSeen = Date.now();
      mxDayAdd(stats, mxDayKey(), 1, correct ? 1 : 0);
    }
  }
  stats.sessions.push({
    subject: session.kind === 'mock' ? 'Mock test' : session.subject,
    systems: session.systems || [],
    total: session.questions.length,
    correct: session.questions.filter(q => session.submitted[q.id] && session.answers[q.id] === q.correct_letter).length,
    date: Date.now(),
    sid: session.id,
    kind: session.kind,

    skipped: Object.assign({}, session.skipped || {}), secs: session.secondsElapsed || 0, limit: session.limit || 0, mode: session.mode || '', rmode: session.reviewMode || 'immediate',
  });

function mockPerformanceHTML(correct, answered, total) {

  </div>`;

    const g = {};

      const k = keyFn(q), e = g[k] || (g[k] = { n: 0, c: 0 });
      e.n++; if (session.submitted[q.id] && session.answers[q.id] === q.correct_letter) e.c++;

    return Object.entries(g).map(([k, e]) => ({ k, n: e.n, c: e.c, pct: Math.round(e.c / e.n * 100) })).sort((a, b) => a.pct - b.pct);

  html += `</div>`;
  const byTopic = groupBy(q => q.topic && q.topic !== q.system ? q.system + ' › ' + q.topic : '').filter(r => r.k && r.n >= 2);
  if (byTopic.length) {
    html += `<div class="section"><div class="section-title">Weakest topics (Medicine)</div></div><div class="bars">`;

}

function mxqWeakSubject(stats) {

function deckSubjects(deck) {
  const names = sub => (MANIFEST[sub] || []).map(x => x.name);

    out.push({ subject: 'ENT', only: null }, { subject: 'Ophthalmology', only: null },
      { subject: 'Medicine', only: names('Medicine').filter(n => M4_MED.includes(n)) },
      { subject: 'Surgery', only: names('Surgery').filter(n => M4_SURG.includes(n)) });
  } else if (deck === 'Final Year MBBS') {
    out.push({ subject: 'Medicine', only: names('Medicine').filter(n => !M4_MED_ONLY.includes(n)) },
      { subject: 'Surgery', only: names('Surgery').filter(n => !M4_SURG.includes(n)) },

// ---- search: list matching questions with the keyword highlighted ----
function mxHl(text, words) {
  const t = String(text || ''); if (!words.length) return escapeHtml(t);
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(t))) { if (m[0] === '') { re.lastIndex++; continue; } out += escapeHtml(t.slice(last, m.index)) + '<mark class="sr-hl">' + escapeHtml(m[0]) + '</mark>'; last = m.index + m[0].length; }
  return out + escapeHtml(t.slice(last));
}
function mxSnippet(text, words, span) {
  const t = String(text || '').replace(/\s+/g, ' '), low = t.toLowerCase(); let p = -1;
  for (const w of words) { const i = low.indexOf(w); if (i >= 0 && (p < 0 || i < p)) p = i; }
  if (p < 0) return '';
  const s = Math.max(0, p - span / 3), e = Math.min(t.length, s + span);
  return (s > 0 ? '…' : '') + t.slice(s, e).trim() + (e < t.length ? '…' : '');
}
function searchOrdered(words) {
  const sc = q => words.some(w => q.stem.toLowerCase().includes(w)) ? 0 : (Object.values(q.options).some(v => words.some(w => String(v).toLowerCase().includes(w))) ? 1 : 2);
  return poolForSetup().map((q, i) => [sc(q), i, q]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map(x => x[2]);
}
function searchResultsHTML(words) {
  const pool = searchOrdered(words), stats = statsCache || { attempts: {} };
  const lim = setup.rl || 15, shown = pool.slice(0, lim);
  let h = `<div class="sr-wrap"><div class="sr-head"><b>${pool.length}</b> matching question${pool.length === 1 ? '' : 's'}</div>`;
  if (!pool.length) return h + `<div class="sr-empty">No question contains all of these words. Try fewer or shorter keywords.</div></div>`;
  shown.forEach((q, i) => {
    const a = stats.attempts[q.id], st = a ? (a.lastCorrect ? '<span class="sr-st ok">answered</span>' : '<span class="sr-st bad">missed</span>') : '';
    const inStem = words.some(w => q.stem.toLowerCase().includes(w));
    const opts = Object.entries(q.options).filter(([L, v]) => words.some(w => String(v).toLowerCase().includes(w)));
    let extra = '';
    if (opts.length) extra += `<div class="sr-opts">${opts.slice(0, 2).map(([L, v]) => `<div><b>${L}.</b> ${mxHl(v, words)}</div>`).join('')}</div>`;
    if (!inStem && !opts.length) { const sn = mxSnippet(q.why_correct + ' ' + (q.take_home || ''), words, 160); if (sn) extra += `<div class="sr-ex"><i>In explanation:</i> ${mxHl(sn, words)}</div>`; }
    h += `<button class="sr-item" data-sr="${escapeHtml(q.id)}"><div class="sr-meta"><span>${escapeHtml(q.system)}${q.topic && q.topic !== q.system ? ' &rsaquo; ' + escapeHtml(q.topic) : ''}</span>${st}</div><div class="sr-stem">${q.stub ? '<i>Tap to open this question</i>' : mxHl(q.stem, words)}</div>${extra}</button>`;
  });
  if (pool.length > lim) h += `<button class="sr-more" id="srMore">Show ${Math.min(15, pool.length - lim)} more (${pool.length - lim} left)</button>`;
  return h + `<div class="sr-tip">Tap a question to practise all ${pool.length} matches, starting from it.${MXQ_ACCT ? ' Search reads inside the questions you have already opened on this device, plus every topic name.' : ''}</div></div>`;
}

const SUBJ_ORDER = ['Gross Anatomy', 'Embryology', 'Histology', 'Physiology', 'Biochemistry', 'Pathology', 'Pharmacology', 'Community Medicine', 'Behavioural Sciences'];
// Chips above a question show only the subject and the chapter. The topic would give the answer away, so it is shown after answering.
function qChips(q) {
  const yd = /Year MBBS$/.test(q.subject) && q.topic && q.topic.indexOf(' \u00b7 ') > 0;
  if (yd) {

    if (q.subject === 'First Year MBBS' || q.subject === 'Second Year MBBS') return { subj: sj, sys: q.system, topic: rest };

function subjOf(n) { const i = n.indexOf(' · '); return i > 0 ? n.slice(0, i) : n; }
function topOf(n) { const i = n.indexOf(' · '); return i > 0 ? n.slice(i + 3) : n; }

    for (const t of ts) { const e = byTopic[s.name + '||' + t.name] || { n: 0, m: 0 }; tn += e.n; tm += e.m; if (setup.topics.includes(s.name + '||' + t.name)) nSel++; }

    const open = searching || setup.open['S:' + n];
    h += `<div class="acc ${open ? 'open' : ''}"><button class="acc-head" data-sacc="${escapeHtml(n)}"><span class="acc-t">${escapeHtml(n)}</span>${nSel && !setup.systems.includes(s.name) ? `<span class="acc-sel">${nSel} selected</span>` : ''}<span class="acc-n">${tn} Qs &middot; ${ts.length} topics</span></button>`;
    if (open) {
      h += `<div class="chip-grid acc-body"><div class="chip ${allSel ? 'selected' : ''}" data-ssel="${escapeHtml(n)}" style="font-weight:700">All of ${escapeHtml(n)} <span class="cnt">${tm}/${tn}</span></div>`;
      for (const t of ts) {
        const key = s.name + '||' + t.name, e = byTopic[key] || { n: 0, m: 0 };
        if (searching && !e.n) continue;
        const sel = setup.topics.includes(key) || setup.systems.includes(s.name);
        const pct = e.n ? Math.round(e.m / e.n * 100) : 0;
        h += `<div class="chip ${sel ? 'selected' : ''}" data-topic="${escapeHtml(key)}">${masteryRingSVG(pct, sel)}${escapeHtml(topOf(t.name))} <span class="cnt">${e.m}/${e.n}</span></div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h;
}

  const bySys = {}, byTopic = {};
  for (const q of subjQ) {
    const m = isMastered(stats, q.id) ? 1 : 0;
    const e = bySys[q.system] || (bySys[q.system] = { n: 0, m: 0 }); e.n++; e.m += m;

  html += `<div class="searchbar"><span class="sicon">&#128269;</span><input type="text" id="qSearch" placeholder="Search topics or keywords…" value="${escapeHtml(setup.query||'')}" autocomplete="off" autocapitalize="off" spellcheck="false">${searching ? '<button id="qClear" aria-label="Clear search">&times;</button>' : ''}</div>`;
  html += `<div class="setup-header"><h2>Build your block</h2><p>${searching ? `<b>${subjQ.length}</b> question${subjQ.length===1?'':'s'} match “${escapeHtml(setup.query)}”. Tap a question below to practise, or narrow by system or topic.` : 'Pick systems or specific topics, block size and mode. ' + (setup.includeAll === false ? 'Questions you already got right are skipped.' : 'You can practise the same topic again and again; every run is saved in Pick up where you left off.')}</p></div>`;

  if (withTopics.length) {

      html += `<div class="acc ${open?'open':''}"><button class="acc-head" data-acc="${escapeHtml(s.name)}"><span class="acc-t">${escapeHtml(s.name)}</span>${nTop?`<span class="acc-sel">${nTop} selected</span>`:''}<span class="acc-n">${(bySys[s.name]||{n:0}).n}</span><span class="acc-c">&#9662;</span></button>`;
      if (open) {
        html += `<div class="chip-grid acc-body">`;
        for (const t of s.topics) {
          const key = s.name+'||'+t.name;
          const e = byTopic[key] || { n: 0, m: 0 };
          if (searching && !e.n) continue;
          const sel = setup.topics.includes(key) || setup.systems.includes(s.name);
          const pct = e.n ? Math.round((e.m / e.n) * 100) : 0;
          html += `<div class="chip ${sel?'selected':''}" data-topic="${escapeHtml(key)}">${masteryRingSVG(pct, sel)}${escapeHtml(t.name)} <span class="cnt">${e.m}/${e.n}</span></div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
  }

  if (!modMode) {

  html += `<div class="chip-grid">`;
  let shown = 0;
  for (const s of systems) {
    const e = bySys[s.name] || { n: 0, m: 0 };
    if (searching && !e.n) continue;
    shown++;
    const sel = setup.systems.includes(s.name);
    const pct = e.n ? Math.round((e.m / e.n) * 100) : 0;
    html += `<div class="chip ${sel?'selected':''}" data-sys="${escapeHtml(s.name)}">
      ${masteryRingSVG(pct, sel)}
      ${escapeHtml(s.name)} <span class="cnt">${e.m}/${e.n}</span>
    </div>`;
  }
  if (!shown) html += `<div style="padding:8px 4px;color:var(--ink-soft);font-size:14px">No questions match your search. Try a shorter keyword.</div>`;
  html += `</div>`;

  }
  html += `<div class="section-title" style="padding:14px 16px 0">Block size</div>`;
  if (setup.count > maxAvail) setup.count = 0;

    <button class="opt-btn ${setup.includeAll !== false ? 'selected' : ''}" data-inc="1">All questions<br><span style="font-weight:400;font-size:11.5px">start again from zero, even ones I got right</span></button>
    <button class="opt-btn ${setup.includeAll === false ? 'selected' : ''}" data-inc="0">New or wrong only<br><span style="font-weight:400;font-size:11.5px">skip ones I already got right</span></button>
  </div>`;
  html += `<div class="section-title" style="padding:14px 16px 0">Mode</div>`;
  html += `<div class="option-row">
    <button class="opt-btn ${setup.mode==='timed'?'selected':''}" data-mode="timed">Timed<br><span style="font-weight:400;font-size:11.5px">~90s/question</span></button>

  </div>`;

  html += `<div class="cta-bar">
    <button class="btn-primary" id="startBtn" ${maxAvail===0?'disabled':''}>Start block (${setup.count>0?Math.min(setup.count,maxAvail):maxAvail} questions)</button>

}

function attachSetupEvents() {
  mxNavBind();
  document.querySelector('[data-back]').addEventListener('click', goHome);
  const qs = document.getElementById('qSearch');
  let qTimer = null;
  qs.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      setup.query = qs.value; setup.count = 0; setup.rl = 15; render();
      const n = document.getElementById('qSearch'); if (n) { n.focus(); const L = n.value.length; try { n.setSelectionRange(L, L); } catch (e) {} }
    }, 250);
  });
  qs.addEventListener('keydown', e => { if (e.key === 'Enter') qs.blur(); });
  const qc = document.getElementById('qClear'); if (qc) qc.addEventListener('click', () => { setup.query = ''; setup.count = 0; render(); });
  document.querySelectorAll('[data-sr]').forEach(el => el.addEventListener('click', () => startSearchBlock(el.getAttribute('data-sr'))));
  const sm = document.getElementById('srMore'); if (sm) sm.addEventListener('click', () => { const y = window.scrollY; setup.rl = (setup.rl || 15) + 15; render(); window.scrollTo(0, y); });
  document.querySelectorAll('[data-acc]').forEach(el => el.addEventListener('click', () => {
    const n = el.getAttribute('data-acc'); setup.open[n] = !setup.open[n]; render();
  }));
  document.querySelectorAll('[data-sacc]').forEach(el => el.addEventListener('click', () => { const n = 'S:' + el.getAttribute('data-sacc'); setup.open[n] = !setup.open[n]; render(); }));
  document.querySelectorAll('[data-ssel]').forEach(el => el.addEventListener('click', () => {
    const sub = el.getAttribute('data-ssel'), s = setupSystems()[0];
    const keys = s.topics.filter(t => subjOf(t.name) === sub).map(t => s.name + '||' + t.name);
    if (setup.systems.includes(s.name)) { setup.systems = []; setup.topics = s.topics.map(t => s.name + '||' + t.name).filter(k => !keys.includes(k)); }
    else { const all = keys.every(k => setup.topics.includes(k)); setup.topics = all ? setup.topics.filter(k => !keys.includes(k)) : setup.topics.concat(keys.filter(k => !setup.topics.includes(k))); }
    setup.count = 0; render();
  }));
  document.querySelectorAll('[data-topic]').forEach(el => el.addEventListener('click', () => {
    const key = el.getAttribute('data-topic'); const sys = key.split('||')[0];
    if (setup.systems.includes(sys)) {
      // expand whole-system selection into its individual topics, minus the one tapped
      setup.systems = setup.systems.filter(x => x !== sys);
      const sm = setupSystems().find(x => x.name === sys);
      setup.topics = setup.topics.filter(k => !k.startsWith(sys+'||')).concat(sm.topics.map(t => sys+'||'+t.name).filter(k => k !== key));
    } else {
      const i = setup.topics.indexOf(key);
      if (i === -1) setup.topics.push(key); else setup.topics.splice(i, 1);
    }
    setup.count = 0; render();
  }));
  document.getElementById('selAll').addEventListener('click', () => {
    setup.systems = setupSystems().map(s=>s.name); setup.topics = [];
    render();
  });
  document.getElementById('selNone').addEventListener('click', () => { setup.systems = []; setup.topics = []; render(); });
  document.querySelectorAll('[data-sys]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-sys');
      const i = setup.systems.indexOf(name);
      if (i === -1) { setup.systems.push(name); setup.topics = setup.topics.filter(k => !k.startsWith(name+'||')); } else setup.systems.splice(i, 1);
      render();
    });
  });
  const availNow = poolForSetup().filter(q => setup.includeAll !== false || !isMastered(statsCache || { attempts: {} }, q.id)).length;
  const curCount = () => (setup.count > 0 ? setup.count : availNow);
  document.getElementById('cntDown').addEventListener('click', () => { setup.count = Math.max(1, curCount() - 1); render(); });
  document.getElementById('cntUp').addEventListener('click', () => { const n = curCount() + 1; setup.count = n >= availNow ? 0 : n; render(); });
  document.getElementById('cntAll').addEventListener('click', () => { setup.count = 0; render(); });
  document.getElementById('cntInput').addEventListener('change', (e) => {
    let n = parseInt(e.target.value, 10);
    if (!n || n < 1) n = 1;
    setup.count = n >= availNow ? 0 : n;
    render();
  });
  document.querySelectorAll('[data-inc]').forEach(el => {
    el.addEventListener('click', () => { setup.includeAll = el.getAttribute('data-inc') === '1'; setup.count = 0; render(); });
  });
  document.querySelectorAll('[data-mode]').forEach(el => {
    el.addEventListener('click', () => { setup.mode = el.getAttribute('data-mode'); render(); });
  });
  document.querySelectorAll('[data-review]').forEach(el => {
    el.addEventListener('click', () => { setup.reviewMode = el.getAttribute('data-review'); render(); });
  });
  document.getElementById('startBtn').addEventListener('click', startQuiz);
}

function quizHTML() {
  const q = currentQuestion();
  const submitted = !!session.submitted[q.id];
  const picked = session.answers[q.id];
  const pct = Math.round(((session.idx) / session.questions.length) * 100);
  const mock = session.kind === 'mock' && !session.finished;
  const immediate = !mock && ((session.reviewMode || 'immediate') !== 'end' || session.finished);
  const answeredN = Object.keys(session.answers).length;

  let html = `<div class="quiz-topbar">
    <button class="qexit" id="qExit">${session.finished ? '&#8592;' : '&times;'}</button>
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qcount">${session.idx+1}/${session.questions.length}</div>
    ${!session.finished && (session.mode==='timed' || mock) ? '<div class="timer" id="quizTimer">--:--</div>' : ''}
    ${mock ? '<button class="qpal" id="palBtn" title="Question list">&#9638;</button>' : ''}
  </div>`;
  if (mock && session.showPalette) {
    html += `<div class="pal-overlay"><div class="pal-card"><div class="pal-head"><b>Questions</b><span>${answeredN} of ${session.questions.length} answered</span><button class="link-btn" id="palClose">Close</button></div><div class="pal-grid">`;
    session.questions.forEach((qq, i) => {
      html += `<button class="pal-q ${session.answers[qq.id] ? 'ans' : ''} ${session.flags[qq.id] ? 'flg' : ''} ${i === session.idx ? 'cur' : ''}" data-goto="${i}">${i + 1}</button>`;
    });
    html += `</div><div class="pal-legend"><span class="ans">answered</span><span class="flg">flagged</span><span>unanswered</span></div><button class="btn-primary" id="palFinish" style="width:100%;margin-top:12px">Finish test</button></div></div>`;
  }

  html += `<div class="qbody">`;
  if (session.idx === 0 && session.justResetPool) {
    html += `<div class="mastery-banner">&#127881; You've mastered every question in this set — starting a fresh round so you can keep reinforcing it.</div>`;
  }
  const _ch = qChips(q);
  html += `<div class="qmeta"><span class="tag subj">${escapeHtml(_ch.subj)}</span><span class="tag sys">${escapeHtml(_ch.sys)}</span>${q.is_new ? '<span class="tag new">New</span>' : ''}</div>`;
  html += `<div class="hl-strip"><span class="hl-lbl">Highlighter</span>${['y','o','g','p'].map(c => `<button class="hl-sd ${hlActive===c?'on':''}" data-hls="${c}" style="background:${HL_COLORS[c]}" aria-label="highlight colour"></button>`).join('')}<button class="hl-sd hl-se ${hlActive==='x'?'on':''}" data-hls="x" aria-label="eraser">&#10005;</button><span class="hl-hint" id="hlHint">${hlActive==='x' ? 'Eraser on: select highlighted text to remove it' : hlActive ? 'Select any text and it turns this colour' : 'Tap a colour, then select text'}</span></div>`;
  html += `<p class="qstem">${escapeHtml(q.stem)}</p>`;

  html += `<div class="flag-row"><button class="flag-btn ${session.flags[q.id]?'flagged':''}" id="flagBtn">&#9873; ${session.flags[q.id]?'Flagged':'Flag for review'}</button></div>`;

  html += `<div class="qoptions">`;
  for (const letter of Object.keys(q.options)) {
    let cls = 'qopt';
    if (submitted) {
      cls += ' disabled';
      if (immediate && letter === q.correct_letter) cls += ' correct';
      else if (immediate && letter === picked) cls += ' incorrect';
      else if (letter === picked) cls += ' picked';
    } else if (session.finished) {
      cls += ' disabled';
    } else if (letter === picked) {
      cls += ' picked';
    }
    html += `<div class="${cls}" data-opt="${letter}">
      <div class="letter">${letter}</div>
      <div class="otext">${escapeHtml(q.options[letter])}</div>
    </div>`;
  }
  html += `</div>`;

  if (submitted && immediate) {
    const correct = picked === q.correct_letter;
    html += `<div class="explain-box">`;
    { const _t = qChips(q).topic; if (_t && !/^other\s*\/\s*mixed$/i.test(_t)) html += `<div class="explain-sec" style="margin-top:0"><h4>Topic</h4><p>${escapeHtml(_t)}</p></div>`; }
    html += `<div class="explain-verdict ${correct?'ok':'no'}">${correct ? '&#10003; Correct' : '&#10007; Incorrect'} — Answer: ${q.correct_letter}. ${escapeHtml(q.options[q.correct_letter])}</div>`;
    html += `<div class="explain-sec"><h4>Why this is correct</h4><p>${escapeHtml(q.why_correct)}</p></div>`;
    if (q.why_wrong && Object.keys(q.why_wrong).length) {
      html += `<div class="explain-sec"><h4>Why the others are wrong</h4>`;
      for (const [letter, txt] of Object.entries(q.why_wrong)) {
        html += `<p class="wrong-item"><b>${letter}.</b> ${escapeHtml(txt)}</p>`;
      }
      html += `</div>`;
    }
    if (q.take_home) {
      html += `<div class="explain-sec"><h4>Take-home pearl</h4><div class="pearl-box">${escapeHtml(q.take_home)}</div></div>`;
    }
    if (q.source) html += `<div class="source-line">${escapeHtml(mxNoUni(q.source))}</div>`;
    html += `</div>`;
  }

  html += `</div>`; // qbody

  html += `<div class="quiz-footer">`;
  if (session.idx > 0) html += `<button class="nav-prev" id="prevBtn">Back</button>`;
  if (session.finished) {
    html += `<button class="nav-skip" id="toResBtn">Results</button>`;
    if (session.idx < session.questions.length - 1) html += `<button class="nav-next" id="nextRevBtn">Next</button>`;
  } else if (mock) {
    html += session.idx < session.questions.length - 1
      ? `<button class="nav-next" id="nextBtn">Next question</button>`
      : `<button class="nav-submit" id="mockFinishBtn">Review &amp; finish</button>`;
  } else if (!submitted) {
    html += `<button class="nav-skip" id="skipBtn">Skip</button>`;
    html += `<button class="nav-submit" id="submitBtn" ${!picked?'disabled':''}>Submit answer</button>`;
  } else {
    if (!immediate) html += `<button class="nav-skip" id="changeBtn">Change answer</button>`;
    html += `<button class="nav-next" id="nextBtn">${session.idx < session.questions.length-1 ? 'Next question' : 'Finish block'}</button>`;
  }
  html += `</div>`;

  return html;
}

function skipQuestion() {
  const q = currentQuestion();
  // Mark as skipped: no answer recorded, not counted as submitted/correct/incorrect,
  // and no stats are written for this question — it's simply left unanswered.
  session.skipped = session.skipped || {};
  session.skipped[q.id] = true;
  nextQuestion();
}

function attachQuizEvents() {
  document.getElementById('qExit').addEventListener('click', exitQuiz);
  const q = currentQuestion();
  const submitted = !!session.submitted[q.id];
  if (!submitted) {
    document.querySelectorAll('[data-opt]').forEach(el => {
      el.addEventListener('click', () => pickOption(el.getAttribute('data-opt')));
    });
  }
  document.getElementById('flagBtn').addEventListener('click', toggleFlag);
  const palB = document.getElementById('palBtn'); if (palB) palB.addEventListener('click', () => { session.showPalette = true; render(); });
  const palC = document.getElementById('palClose'); if (palC) palC.addEventListener('click', () => { session.showPalette = false; render(); });
  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => { session.idx = parseInt(el.getAttribute('data-goto'), 10); session.showPalette = false; saveSession(); render(); }));
  const confirmFinish = () => {
    const un = session.questions.length - Object.keys(session.answers).length;
    if (confirm(un ? `You have ${un} unanswered question${un === 1 ? '' : 's'}. Finish the test now?` : 'Finish the test now?')) { session.showPalette = false; finishQuiz(); }
  };
  const pf = document.getElementById('palFinish'); if (pf) pf.addEventListener('click', confirmFinish);
  const mf = document.getElementById('mockFinishBtn'); if (mf) mf.addEventListener('click', confirmFinish);
  const chb = document.getElementById('changeBtn'); if (chb) chb.addEventListener('click', changeAnswer);
  const trb = document.getElementById('toResBtn'); if (trb) trb.addEventListener('click', () => { currentScreen = 'results'; render(); });
  const nrb = document.getElementById('nextRevBtn'); if (nrb) nrb.addEventListener('click', () => { session.idx++; render(); });
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', submitAnswer);
  const skipBtn = document.getElementById('skipBtn');
  if (skipBtn) skipBtn.addEventListener('click', skipQuestion);
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.addEventListener('click', nextQuestion);
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.addEventListener('click', prevQuestion);
}

function resultsHTML() {
  const total = session.questions.length;
  const correct = session.questions.filter(q => session.answers[q.id] === q.correct_letter && session.submitted[q.id]).length;
  const answered = session.questions.filter(q => session.submitted[q.id]).length;
  const pct = session.kind === 'mock' ? (total ? Math.round((correct / total) * 100) : 0) : (answered ? Math.round((correct / answered) * 100) : 0);
  const circumference = 2 * Math.PI * 52;
  const offset = circumference - (pct / 100) * circumference;
  const color = pct >= 70 ? '#0F6E56' : pct >= 50 ? '#BA7517' : '#A32D2D';

  let html = `<div class="results-hero">
    <div class="score-ring">
      <svg width="120" height="120">
        <circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.2)" stroke-width="10" fill="none"/>
        <circle cx="60" cy="60" r="52" stroke="${color}" stroke-width="10" fill="none" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="pct">${pct}%</div>
    </div>
    <h2>${session.kind === 'mock' ? 'Mock test complete' : 'Block complete'}</h2>
    <p>${session.kind === 'mock' ? correct + ' of ' + total + ' correct (' + Math.round(correct / total * 100) + '% of the whole test)' : correct + ' of ' + answered + ' answered correctly'}</p>
  </div>`;

  html += `<div class="result-grid">

/* ===== Calendar date picker ===== */
function mxCal(o) {

  const MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  let vy = base.getFullYear(), vm = base.getMonth();
  const ov = document.createElement('div'); ov.className = 'mxc-ov'; document.body.appendChild(ov);
  const close = () => ov.remove();
  function draw() {
    const first = (new Date(vy, vm, 1).getDay() + 6) % 7, dim = new Date(vy, vm + 1, 0).getDate();
    let cells = ''; for (let i = 0; i < first; i++) cells += '<i></i>';
    for (let d = 1; d <= dim; d++) { const k = iso(vy, vm, d); cells += `<button class="mxc-d ${k === sel ? 'sel' : ''} ${k === today ? 'tod' : ''}" data-d="${k}">${d}</button>`; }
    let info = 'Tap a day to choose it';
    if (sel) { const dt = new Date(sel + 'T00:00:00'), n = Math.round((dt - new Date(today + 'T00:00:00')) / 86400000); info = dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' &middot; ' + (n > 0 ? n + ' days to go' : n === 0 ? 'today' : Math.abs(n) + ' days ago'); }
    ov.innerHTML = `<div class="mxc"><div class="mxc-t">${escapeHtml(o.title || 'Choose a date')}</div>
      <div class="mxc-nav"><button data-m="-12">&laquo;</button><button data-m="-1">&lsaquo;</button><b>${MN[vm]} ${vy}</b><button data-m="1">&rsaquo;</button><button data-m="12">&raquo;</button></div>
      <div class="mxc-w"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="mxc-g">${cells}</div><div class="mxc-i">${info}</div>
      <div class="mxc-b">${o.onClear ? '<button data-a="clear" class="g">Clear</button>' : ''}<button data-a="cancel" class="g">Cancel</button><button data-a="save" class="p" ${sel ? '' : 'disabled'}>Save</button></div></div>`;
  }
  ov.addEventListener('click', e => {
    if (e.target === ov) { close(); return; }
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.m) { const n = vy * 12 + vm + parseInt(b.dataset.m, 10); vy = Math.floor(n / 12); vm = n % 12; draw(); }

    else if (b.dataset.a === 'cancel') close();

    else if (b.dataset.a === 'save' && sel) { close(); o.onSave && o.onSave(sel); }
  });
  draw();
}

      if (!keep.length) { trYearModal(open[0].yr, false); return; }
      arguments[0] = keep;
      if (dropped) setTimeout(() => trModal(`<h2>Free-trial limit</h2><p>This block has <b>${keep.length}</b> question${keep.length === 1 ? '' : 's'} instead of ${open.length}, because that is all you have left free in the year${keep.length === 1 ? '' : 's'} it covers.</p>${trYearRows()}<button class="tr-ok" data-trclose="1">OK</button>`), 600);
    }
    return _trBeginL.apply(this, arguments);
  };
  function trOpenN(f) { return QBANK.reduce((a, q) => a + (!q.locked && f(q) ? 1 : 0), 0); }
  function trChipOpen(el) {
    let k;
    if ((k = el.getAttribute('data-sys'))) return trOpenN(q => q.subject === setup.subject && q.system === k);
    if ((k = el.getAttribute('data-topic'))) { const p = k.split('||'); return trOpenN(q => q.subject === setup.subject && q.system === p[0] && q.topic === p[1]); }
    if ((k = el.getAttribute('data-mkeys'))) {
      const ks = JSON.parse(k), mt = (q, x) => { const p = x.split('|'); return p[0] === 'S' ? q.subject === p[1] : p[0] === 'Y' ? q.subject === p[1] && q.system === p[2] : q.subject === p[1] && q.system === p[2] && q.topic === p[3]; };
      return trOpenN(q => ks.some(x => mt(q, x)));
    }
    if ((k = el.getAttribute('data-msel'))) {
      const p = k.split('|');
      if (p[0] === 'S') return trOpenN(q => q.subject === p[1]);
      if (p[0] === 'Y') return trOpenN(q => q.subject === p[1] && q.system === p[2]);
      return trOpenN(q => q.subject === p[1] && q.system === p[2] && q.topic === p[3]);
    }
    return 1;
  }
  // locked parts
  document.addEventListener('click', e => {
    const ch = e.target.closest && e.target.closest('.chip[data-sys],.chip[data-topic],.chip[data-msel],.chip[data-mkeys]');
    if (ch && !e.target.closest('[data-mtop]')) { if (trChipOpen(ch) === 0) { e.stopPropagation(); e.preventDefault(); trNoSampleModal(); } return; }
    const t = e.target.closest && e.target.closest('[data-group^="study"],[data-nav="leaders"],[data-pdf-read],[data-pdf-dl]');
    if (!t) return;
    if (t.hasAttribute('data-pdf-read') || t.hasAttribute('data-pdf-dl')) {
      const id = t.getAttribute('data-pdf-read') || t.getAttribute('data-pdf-dl');
      if (TR && TR.p.indexOf(id) >= 0) return;
      e.stopPropagation(); e.preventDefault(); trLockedModal('This sheet'); return;
    }
    e.stopPropagation(); e.preventDefault();
    trLockedModal(t.hasAttribute('data-nav') ? 'The Leaderboard' : 'Study with us');
  }, true);
  // tidy the screens after each render
  const _trRender = render;
  render = function () {
    if (TR_DEAD) return;
    const r = _trRender.apply(this, arguments);
    try {
      document.querySelectorAll('.pdf-card').forEach(c => {
        const b = c.querySelector('[data-pdf-read]'); if (!b) return;
        const id = b.getAttribute('data-pdf-read'), ok = TR && TR.p.indexOf(id) >= 0;
        if (!ok) { c.classList.add('tr-locked'); c.querySelector('[data-pdf-read]').innerHTML = '&#128274; Locked'; c.querySelector('[data-pdf-dl]').innerHTML = '&#128274; Locked'; }
        else { const p = c.querySelector('.pdf-tx p'); if (p) p.innerHTML = '<b style="color:#0F6E56">Free in your trial</b> &middot; read online or download'; }
      });
      const sd = document.querySelector('[data-group="study"] .deck-tx span'); if (sd) sd.innerHTML = '&#128274; Full access only';
      document.querySelectorAll('.tr-lk,.tr-free,.tr-acl,.tr-fr2').forEach(e => e.remove());
      // each year deck shows how much of it is free
      const _yc = { 'First Year MBBS': '1', 'Second Year MBBS': '2', 'Third Year MBBS': '3', 'Fourth Year MBBS': '4', 'Final Year MBBS': 'F' };
      document.querySelectorAll('.subject-card[data-group^="lumhs:"]').forEach(c => {
        const y = _yc[(c.getAttribute('data-group') || '').slice(6)]; if (!y) return;
        const left = trYLeft(y), t = left === TR_PER ? 'Only ' + TR_PER + ' Qs free' : left > 0 ? left + ' of ' + TR_PER + ' Qs left' : 'Free Qs finished';
        let b = c.querySelector('.tr-yb');
        if (!b) { b = document.createElement('span'); b.className = 'tr-yb'; c.appendChild(b); }
        b.textContent = t; b.classList.toggle('done', left === 0);
      });
      trTick();
    } catch (e) {}
    return r;
  };
  function trTick() {
    if (!TR || TR_DEAD) return;
    TR.last = Math.max(TR.last || 0, trNow());
    if (trLeftMs() <= 0) { trSave(); trShowExpired(); return; }
    const l = document.getElementById('trLeft'), q = document.getElementById('trQ');
    if (l) { const m = Math.floor(trLeftMs() / 60000), h = Math.floor(m / 60); l.textContent = (h ? h + ' h ' : '') + (m % 60) + ' min left'; }
    if (q) q.textContent = trLeftQ() ? trLeftQ() + ' of ' + TR_MAX + ' free questions left (' + TR_YORDER.map(y => TR_YEARS[y].replace(' Year', '') + ': ' + trYLeft(y)).join(' \u00B7 ') + ')' : 'All ' + TR_MAX + ' free questions used. Message us on Instagram or WhatsApp for full access.';
  }
  setInterval(() => { try { trTick(); if (TR && !TR_DEAD && (Date.now() % 600000) < 20000) trSave(); } catch (e) {} }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { try { trServerSync().then(trTick); trTick(); } catch (e) {} } });
  // first screen after the trial starts
  const _trHomeAttach = attachHomeEvents;
  attachHomeEvents = function () {
    const r = _trHomeAttach.apply(this, arguments);
    if (TR && !TR.sh && !document.getElementById('trOv')) { TR.sh = 1; trSave(); trStartModal(); }
    return r;
  };
}
</script>
</body>
</html>
